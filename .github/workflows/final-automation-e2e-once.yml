name: Final automation E2E once

on:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit one canonical automation request
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://webl.desorden-help-76b.workers.dev/automatizacion/submit' \
            -H 'Content-Type: application/json' \
            --data '{"cliente":"E2E DESORDEN WEB FINAL","empresa":"DESORDEN QA","telefono":"600000003","email":"desorden.help@gmail.com","servicio":"Aerotermia","descripcion":"Prueba E2E final controlada del formulario WEB con esquema canónico.","prioridad":"BAJA","observaciones":"E2E-WEB-260914-1730"}')"
          echo "Gateway HTTP status: $status"
          echo "Gateway response:"
          cat "$body_file"
          echo
          test "$status" = "200"
          node -e 'const fs=require("fs"); const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(body?.ok!==true) process.exit(1)' "$body_file"
