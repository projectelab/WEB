name: Diagnose Google Forms upstream once

on:
  push:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit one diagnostic request and print safe gateway response
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -sS -o "$body_file" -w '%{http_code}' \
            -X POST 'https://webl.desorden-help-76b.workers.dev/automatizacion/submit' \
            -H 'Content-Type: application/json' \
            --data '{"cliente":"E2E DESORDEN WEB DIAG","empresa":"DESORDEN QA","telefono":"600000002","email":"desorden.help@gmail.com","servicio":"Prueba E2E Diagnóstico","descripcion":"Prueba diagnóstica única del gateway Google Forms tras despliegue.","prioridad":"BAJA","observaciones":"E2E-WEB-260914-1720"}')"
          echo "Gateway HTTP status: $status"
          echo "Gateway response:"
          cat "$body_file"
          echo
