name: Deploy DESORDEN to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: desorden-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Normalize Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail

          raw="$RAW_CLOUDFLARE_API_TOKEN"
          test -n "$raw" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

          compact="$(printf '%s' "$raw" | tr -d '\r\n')"
          compact="$(printf '%s' "$compact" | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//')"

          token="$compact"
          if [[ "$token" == [Bb]earer\ * ]]; then
            token="${token#* }"
          elif [[ "$token" == CLOUDFLARE_API_TOKEN=* ]]; then
            token="${token#*=}"
          fi

          token="$(printf '%s' "$token" | tr -d '"' | tr -d "'" | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//')"
          test -n "$token" || { echo "The Cloudflare API token secret is empty after normalization."; exit 1; }

          account_id="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n[:space:]')"
          test -n "$account_id" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          echo "::add-mask::$token"
          echo "::add-mask::$account_id"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account_id" >> "$GITHUB_ENV"

          echo "Cloudflare token characters: ${#token}"
          if [[ "$token" == cfat_* ]]; then
            echo "Cloudflare token format: account API token"
            printf 'CLOUDFLARE_TOKEN_KIND=account\n' >> "$GITHUB_ENV"
          elif [[ "$token" == cfut_* ]]; then
            echo "Cloudflare token format: user API token"
            printf 'CLOUDFLARE_TOKEN_KIND=user\n' >> "$GITHUB_ENV"
          elif [[ "$token" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Cloudflare token format: legacy-compatible user token"
            printf 'CLOUDFLARE_TOKEN_KIND=user\n' >> "$GITHUB_ENV"
          else
            echo "Invalid token characters detected."
            exit 1
          fi

      - name: Verify Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLOUDFLARE_TOKEN_KIND" == "account" ]]; then
            verify_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"
          else
            verify_url="https://api.cloudflare.com/client/v4/user/tokens/verify"
          fi
          response="$(curl -sS --fail-with-body \
            "$verify_url" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          RESPONSE="$response" node -e '
            const body = JSON.parse(process.env.RESPONSE);
            if (!body.success || body.result?.status !== "active") {
              console.error("Cloudflare rejected the API token:", JSON.stringify(body.errors || body));
              process.exit(1);
            }
            console.log("Cloudflare API token is valid and active.");
          '

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Deploy Worker static assets
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify active Cloudflare deployment
        shell: bash
        run: |
          set -euo pipefail

          output="$RUNNER_TEMP/wrangler-output.ndjson"
          test -s "$output" || { echo "Missing Wrangler deployment output."; exit 1; }

          deploy_entry="$(jq -sc '[.[] | select(.type=="deploy")] | last' "$output")"
          deployed_version="$(jq -r '.version_id // empty' <<< "$deploy_entry")"
          deployed_worker="$(jq -r '.worker_name // empty' <<< "$deploy_entry")"

          test "$deployed_worker" = "webl" || {
            echo "Unexpected Worker name: ${deployed_worker:-missing}"
            exit 1
          }
          test -n "$deployed_version" || {
            echo "Wrangler did not report a deployed version ID."
            exit 1
          }

          active_version=""
          for attempt in {1..6}; do
            deployment_status="$(npx wrangler deployments status --config wrangler.jsonc --json)"
            active_version="$(jq -r '
              (.versions // [])
              | map(select(.percentage == 100) | .version_id)
              | if length == 1 then .[0] else empty end
            ' <<< "$deployment_status")"

            if [[ "$active_version" == "$deployed_version" ]]; then
              echo "Cloudflare confirms version $deployed_version is active for Worker webl."
              break
            fi

            echo "Waiting for Cloudflare deployment metadata propagation ($attempt/6)..."
            sleep 5
          done

          test "$active_version" = "$deployed_version" || {
            echo "Cloudflare active version mismatch after propagation wait."
            echo "Expected: $deployed_version"
            echo "Active:   ${active_version:-missing}"
            exit 1
          }

      - name: Check public production endpoints
        shell: bash
        run: |
          set -euo pipefail

          origin="https://www.desorden.cat"
          user_agent="DESORDEN-Deploy-Smoke-Test/1.0"
          managed_challenge_urls=()

          record_managed_challenge() {
            local status="$1"
            local headers="$2"
            local url="$3"

            if [[ "$status" == "403" ]] && grep -qi '^cf-mitigated:[[:space:]]*challenge' "$headers"; then
              managed_challenge_urls+=("$url")
              echo "::warning::Public HTTP check inconclusive: Cloudflare issued a Managed Challenge to the GitHub-hosted runner for $url. Deployment state was verified separately through the authenticated Wrangler control plane."
              return 0
            fi

            return 1
          }

          check_page() {
            local url="$1"
            local required_a="$2"
            local required_b="$3"
            local forbidden="${4:-}"
            local headers body clean_headers status

            headers="$(mktemp)"
            body="$(mktemp)"
            clean_headers="$(mktemp)"

            status="$(curl -sS -A "$user_agent" --max-time 20 \
              -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            tr -d '\r' < "$headers" > "$clean_headers"

            if [[ "$status" == "200" ]]; then
              grep -qF "$required_a" "$body"
              grep -qF "$required_b" "$body"
              if [[ -n "$forbidden" ]] && grep -Eq "$forbidden" "$body"; then
                echo "Forbidden production content found at $url"
                return 1
              fi
              echo "Public content verified: $url"
              return 0
            fi

            if record_managed_challenge "$status" "$clean_headers" "$url"; then
              return 0
            fi

            echo "Unexpected HTTP status $status from $url"
            sed -n '1,20p' "$clean_headers"
            return 1
          }

          check_page "$origin/" "SI NO ET VEUEN" 'data-n="05"'
          check_page "$origin/produccio-audiovisual/" "Producció audiovisual que fa que et triïn." 'href="/produccio-audiovisual/dron-video-aeri/"'
          check_page "$origin/produccio-audiovisual/dron-video-aeri/" "Preses aèries amb dron" 'href="/produccio-audiovisual/"'
          check_page "$origin/automatitzacio-sistemes/" "MENYS FEINA MANUAL." 'id="contact-form"'
          check_page "$origin/disseny-web/" "Webs d’impacte construïdes" 'href="/automatitzacio-sistemes/"'

          check_redirect() {
            local url="$1"
            local expected_location="$2"
            local headers clean_headers status location

            headers="$(mktemp)"
            clean_headers="$(mktemp)"
            status="$(curl -sS -A "$user_agent" --max-time 20 \
              -D "$headers" -o /dev/null -w '%{http_code}' "$url" || true)"
            tr -d '\r' < "$headers" > "$clean_headers"

            if [[ "$status" != "301" ]]; then
              if record_managed_challenge "$status" "$clean_headers" "$url"; then
                return 0
              fi
              echo "Expected 301 from $url, got $status"
              sed -n '1,20p' "$clean_headers"
              return 1
            fi

            location="$(sed -n 's/^[Ll]ocation:[[:space:]]*//p' "$clean_headers" | head -n 1)"
            if [[ "$location" != "$expected_location" ]]; then
              echo "Unexpected redirect location from $url: ${location:-missing}"
              return 1
            fi

            echo "Redirect verified: $url -> $location"
          }

          check_redirect "$origin/automatizacion/?codex_deploy_smoke=1" \
            "$origin/automatitzacio-sistemes/?codex_deploy_smoke=1"
          check_redirect "https://desorden.cat/" "https://www.desorden.cat/"

          if ((${#managed_challenge_urls[@]})); then
            {
              echo "### Public HTTP endpoint checks: INCONCLUSIVE"
              echo
              echo "Cloudflare Managed Challenge blocked the GitHub-hosted runner. The authenticated Wrangler control-plane check confirmed the active deployment; challenged public responses were not counted as content or redirect verification."
              printf -- '- %s\n' "${managed_challenge_urls[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Public HTTP endpoint checks: VERIFIED"
              echo
              echo "All public page content and redirect checks passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify live security headers and contact API
        shell: bash
        run: |
          set -euo pipefail

          origin="https://www.desorden.cat"
          user_agent="DESORDEN-Security-Smoke-Test/1.0"
          headers="$(mktemp)"
          clean_headers="$(mktemp)"
          body="$(mktemp)"

          status="$(curl -sS -A "$user_agent" --max-time 20             -D "$headers" -o "$body" -w '%{http_code}' "$origin/" || true)"
          tr -d '\r' < "$headers" > "$clean_headers"

          if [[ "$status" == "403" ]] && grep -qi '^cf-mitigated:[[:space:]]*challenge' "$clean_headers"; then
            echo "::warning::Cloudflare issued a Managed Challenge to the GitHub-hosted runner. Live header/contact verification cannot be completed from this runner; authenticated Wrangler deployment and source-level security tests already passed."
            exit 0
          fi

          test "$status" = "200" || {
            echo "Expected 200 from $origin/, got $status"
            sed -n '1,30p' "$clean_headers"
            exit 1
          }

          grep -qi '^content-security-policy: ' "$clean_headers"
          grep -qi "default-src 'self'" "$clean_headers"
          grep -qi "script-src 'self'" "$clean_headers"
          grep -qi "style-src 'self' https://fonts.googleapis.com" "$clean_headers"
          grep -qi "font-src 'self' https://fonts.gstatic.com" "$clean_headers"
          grep -qi "connect-src 'self'" "$clean_headers"
          grep -qi "frame-ancestors 'none'" "$clean_headers"
          grep -qi '^strict-transport-security: max-age=63072000; includeSubDomains; preload "$clean_headers"
          grep -qi '^x-content-type-options: nosniff "$clean_headers"
          grep -qi '^x-frame-options: DENY "$clean_headers"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin "$clean_headers"
          grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=() "$clean_headers"

          if grep -qiE "unsafe-inline|unsafe-eval" "$clean_headers"; then
            echo "CSP unexpectedly allows unsafe-inline or unsafe-eval."
            exit 1
          fi

          font_status="$(curl -sS -A "$user_agent" --max-time 20             -o /dev/null -w '%{http_code}'             'https://fonts.googleapis.com/css2?family=Anton&display=swap' || true)"
          test "$font_status" = "200" || {
            echo "Google Fonts stylesheet unavailable: HTTP $font_status"
            exit 1
          }

          api_headers="$(mktemp)"
          api_clean="$(mktemp)"
          api_body="$(mktemp)"
          api_status="$(curl -sS -A "$user_agent" --max-time 20             -X POST "$origin/api/contact"             -H 'Content-Type: application/json'             --data '{"website":"security-check"}'             -D "$api_headers" -o "$api_body" -w '%{http_code}' || true)"
          tr -d '\r' < "$api_headers" > "$api_clean"

          test "$api_status" = "200" || {
            echo "Expected 200 from /api/contact honeypot probe, got $api_status"
            sed -n '1,30p' "$api_clean"
            cat "$api_body"
            exit 1
          }
          grep -q '"ok":true' "$api_body"
          grep -qi '^content-security-policy: ' "$api_clean"
          grep -qi '^x-frame-options: DENY "$api_clean"

          echo "Live security headers, Google Fonts and /api/contact verified."
