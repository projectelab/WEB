name: Optimize PageSpeed assets

on:
  push:
    branches:
      - perf/pagespeed-mobile-20260925
    paths:
      - .github/workflows/optimize-pagespeed-assets.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/pagespeed-mobile-20260925
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize versioned logo assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
              'logo-ajuntament-svc',
              'logo-fce',
              'logo-ntk',
              'logo-pugnator',
              'logo-the-club-padel',
              'logo-viu-svc',
          ]
          root = Path('public/media/portfolio')
          rows = []
          for name in names:
              src = root / f'{name}.png'
              dst = root / f'{name}.20260925.webp'
              before = src.stat().st_size
              with Image.open(src) as im:
                  im.load()
                  original = im.size
                  if im.mode not in ('RGB','RGBA'):
                      im = im.convert('RGBA' if 'transparency' in im.info else 'RGB')
                  im.thumbnail((640,640), Image.Resampling.LANCZOS)
                  resized = im.size
                  im.save(dst, 'WEBP', lossless=True, method=6, exact=True)
              after = dst.stat().st_size
              rows.append((name, original, resized, before, after))
          print('IMAGE_OPTIMIZATION_REPORT')
          total_before = total_after = 0
          for name, original, resized, before, after in rows:
              total_before += before; total_after += after
              print(f'{name}|{original[0]}x{original[1]}|{resized[0]}x{resized[1]}|{before}|{after}|{before-after}')
          print(f'TOTAL|{total_before}|{total_after}|{total_before-total_after}')
          PY
      - name: Self-host Anton WOFF2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/fonts
          CSS="$(curl -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36' -fsSL 'https://fonts.googleapis.com/css2?family=Anton&display=swap')"
          URL="$(printf '%s' "$CSS" | awk '/\/\* latin \*\//{f=1;next} f && /src: url\(/ {sub(/^.*url\(/,""); sub(/\).*$/,""); print; exit}')"
          test -n "$URL"
          curl -L --fail --retry 3 "$URL" -o public/assets/fonts/anton-latin.20260925.woff2
          python - <<'PY'
          from pathlib import Path
          p=Path('public/assets/fonts/anton-latin.20260925.woff2')
          data=p.read_bytes()
          assert len(data)>10000, 'Anton font unexpectedly small'
          print(f'ANTON_WOFF2_BYTES={len(data)}')
          PY
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/portfolio/*.20260925.webp public/assets/fonts/anton-latin.20260925.woff2
          git commit -m 'perf: optimize logos and self-host Anton'
          git push origin HEAD:perf/pagespeed-mobile-20260925
