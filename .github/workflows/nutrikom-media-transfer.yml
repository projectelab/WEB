name: Stage Nutrikom media
on:
  push:
    branches:
      - feat/nutrikom-real-video-20260923
    paths:
      - .github/workflows/nutrikom-media-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    if: github.event.head_commit.message == 'chore: stage Nutrikom binary transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Nutrikom media
        env:
          HQ_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-aba0-81f4-ad85-7f824093db50/raw?se=2026-09-23T14%3A57%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d5638dae-29dd-5409-aa23-012a9c15d26e&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T05%3A02%3A20Z&ske=2026-09-24T05%3A02%3A20Z&sks=b&skv=2026-02-06&sig=vpyNqekhcnLl5BQOwORGEGZ/WyIqBSYNJzi57XsKAco%3D'
          PREVIEW_URL: 'https://sdmntprwestus2.oaiusercontent.com/files/00000000-d1f8-81f8-b5ea-af1e9a2bb053/raw?se=2026-09-23T14%3A57%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=5bd02cd0-9705-53ef-8e8b-6e409e9d0f35&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-23T13%3A53%3A12Z&ske=2026-09-24T13%3A53%3A12Z&sks=b&skv=2026-02-06&sig=mi64kkI1PAEh0QqcjMErY87Gs2wnFfW4DGNgbGiW%2B5o%3D'
        run: |
          mkdir -p public/media/portfolio/hq public/media/portfolio/previews-v2
          curl -L --fail --retry 3 --retry-delay 2 "$HQ_URL" -o "public/media/portfolio/hq/nutrikom-ntk-runners.mp4"
          curl -L --fail --retry 3 --retry-delay 2 "$PREVIEW_URL" -o "public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4"
      - name: Verify checksums and sizes
        run: |
          echo "e87050399787e4a61447df45caac12db7a191a326e51ca900edf10c698a343a3  public/media/portfolio/hq/nutrikom-ntk-runners.mp4" | sha256sum -c -
          echo "028cf815e4feba0813ed816ff7316d1b5229bb4b343fa75bf131579937d38be1  public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4" | sha256sum -c -
          test "$(stat -c%s 'public/media/portfolio/hq/nutrikom-ntk-runners.mp4')" -lt 26214400
          test "$(stat -c%s 'public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4')" -lt 26214400
          test -f public/media/portfolio/previews-v2/nutrikom-ntk-runners.webp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Commit binary media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/media/portfolio/hq/nutrikom-ntk-runners.mp4" "public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4"
          git commit -m "feat: add Nutrikom HQ and preview media"
          git push origin HEAD:feat/nutrikom-real-video-20260923
