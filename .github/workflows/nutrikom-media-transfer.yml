name: Stage Nutrikom media
# retry: 2026-09-23T14:57Z
on:
  push:
    branches:
      - "feat/nutrikom-real-video-20260923"
    paths:
      - ".github/workflows/nutrikom-media-transfer.yml"

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Nutrikom media
        shell: bash
        run: |
          source .github/nutrikom-transfer.env
          mkdir -p public/media/portfolio/hq public/media/portfolio/previews-v2
          curl -L --fail --retry 3 --retry-delay 2 "$HQ_URL" -o public/media/portfolio/hq/nutrikom-ntk-runners.mp4
          curl -L --fail --retry 3 --retry-delay 2 "$PREVIEW_URL" -o public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4
      - name: Verify checksums and sizes
        run: |
          echo "e87050399787e4a61447df45caac12db7a191a326e51ca900edf10c698a343a3  public/media/portfolio/hq/nutrikom-ntk-runners.mp4" | sha256sum -c -
          echo "028cf815e4feba0813ed816ff7316d1b5229bb4b343fa75bf131579937d38be1  public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4" | sha256sum -c -
          test "$(stat -c%s public/media/portfolio/hq/nutrikom-ntk-runners.mp4)" -lt 26214400
          test "$(stat -c%s public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4)" -lt 26214400
          test -f public/media/portfolio/previews-v2/nutrikom-ntk-runners.webp
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Commit binary media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/portfolio/hq/nutrikom-ntk-runners.mp4 public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4
          git commit -m "feat: add Nutrikom HQ and preview media"
          git push origin HEAD:feat/nutrikom-real-video-20260923
