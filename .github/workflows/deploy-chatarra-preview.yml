name: Deploy CHATARRA preview to Cloudflare

on:
  push:
    branches:
      - preview/chatarra-client-20260924
  workflow_dispatch:

concurrency:
  group: chatarra-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-9dcc-81f4-ae49-87fdbbd03f10/raw?se=2026-09-24T20%3A44%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=2dde962d-c4bf-5a6a-a7e2-3c1dbac0a54a&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T19%3A21%3A51Z&ske=2026-09-25T19%3A21%3A51Z&sks=b&skv=2026-02-06&sig=RvlBASVVlUUtSBzcP3rPT2tEbiivNm56BMZQzulSidQ%3D"

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Prepare V9 package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 "$PREVIEW_ZIP_URL" -o preview.zip
          unzip -q preview.zip -d preview-src

          test -f preview-src/chatarra-landing-preview-v9/dist/index.html
          test -f preview-src/chatarra-landing-preview-v9/dist/media/chatarra-hero-loop-v9.mp4
          test -f preview-src/chatarra-landing-preview-v9/dist/images/cobre.webp
          test -f preview-src/chatarra-landing-preview-v9/dist/images/acero.webp

          rm -rf chatarra-preview-dist
          cp -a preview-src/chatarra-landing-preview-v9/dist chatarra-preview-dist

          grep -q 'client-video-v9' chatarra-preview-dist/index.html
          grep -q 'chatarra-hero-loop-v9.mp4' chatarra-preview-dist/index.html
          grep -q 'material-photos' chatarra-preview-dist/index.html
          grep -q '/images/cobre.webp' chatarra-preview-dist/index.html
          grep -q '/images/acero.webp' chatarra-preview-dist/index.html
          grep -q 'noindex, follow' chatarra-preview-dist/index.html

      - name: Verify Cloudflare authentication
        run: npx --yes wrangler@4 whoami

      - name: Deploy V9
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.chatarra-preview.jsonc 2>&1 | tee wrangler-preview.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-preview.log | tail -1 || true)"
          test -n "$url"
          echo "CHATARRA_PREVIEW_URL=$url" >> "$GITHUB_ENV"

      - name: Smoke test V9
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            body="$(mktemp)"
            video_headers="$(mktemp)"
            cobre_headers="$(mktemp)"
            acero_headers="$(mktemp)"

            page_status="$(curl -sS -L --max-time 20 -o "$body" -w '%{http_code}' "$CHATARRA_PREVIEW_URL/?v=9" || true)"
            video_status="$(curl -sS -I -L --max-time 20 -o "$video_headers" -w '%{http_code}' "$CHATARRA_PREVIEW_URL/media/chatarra-hero-loop-v9.mp4" || true)"
            cobre_status="$(curl -sS -I -L --max-time 20 -o "$cobre_headers" -w '%{http_code}' "$CHATARRA_PREVIEW_URL/images/cobre.webp" || true)"
            acero_status="$(curl -sS -I -L --max-time 20 -o "$acero_headers" -w '%{http_code}' "$CHATARRA_PREVIEW_URL/images/acero.webp" || true)"

            if [[ "$page_status" == "200" && "$video_status" == "200" && "$cobre_status" == "200" && "$acero_status" == "200" ]] &&                grep -q 'client-video-v9' "$body" &&                grep -q 'chatarra-hero-loop-v9.mp4' "$body" &&                grep -q '/images/cobre.webp' "$body" &&                grep -q '/images/acero.webp' "$body"; then
              echo "V9 verified: $CHATARRA_PREVIEW_URL/?v=9"
              exit 0
            fi

            echo "Waiting for V9 ($attempt/10), page=$page_status video=$video_status cobre=$cobre_status acero=$acero_status"
            sleep 5
          done
          exit 1
