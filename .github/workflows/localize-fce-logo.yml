name: Localize FCE logo

on:
  push:
    branches:
      - fix/unify-contact-ctas-local-fce-20260924
    paths:
      - .github/workflows/localize-fce-logo.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-contact-ctas-local-fce-20260924
      - name: Download official FCE logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/portfolio
          curl -L --fail --retry 3             'https://esgrima.cat/wp-content/uploads/2024/08/FCELogo.png'             -o public/media/portfolio/logo-fce.png
          python - <<'PY'
          from pathlib import Path
          p=Path('public/media/portfolio/logo-fce.png')
          data=p.read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'Downloaded file is not PNG'
          assert len(data)>1000, 'Downloaded PNG unexpectedly small'
          print(f'logo-fce.png: {len(data)} bytes')
          PY
      - name: Commit localized logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/portfolio/logo-fce.png
          if git diff --cached --quiet; then
            echo 'Logo already localized.'
            exit 0
          fi
          git commit -m 'assets: localize FCE logo'
          git push origin HEAD:fix/unify-contact-ctas-local-fce-20260924
