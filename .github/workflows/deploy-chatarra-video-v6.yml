name: Deploy CHATARRA V6 video preview

on:
  push:
    branches:
      - preview/chatarra-video-v6
  workflow_dispatch:

concurrency:
  group: chatarra-preview-v6
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORIGIN: https://chatarra-preview.desorden-help-76b.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare current landing snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf chatarra-v6-dist
          mkdir -p chatarra-v6-dist/aviso-legal chatarra-v6-dist/privacidad
          curl -fsSL "$ORIGIN/" -o chatarra-v6-dist/index.html
          curl -fsSL "$ORIGIN/aviso-legal/" -o chatarra-v6-dist/aviso-legal/index.html
          curl -fsSL "$ORIGIN/privacidad/" -o chatarra-v6-dist/privacidad/index.html
          for f in robots.txt sitemap.xml favicon.svg 404.html _headers; do
            curl -fsSL "$ORIGIN/$f" -o "chatarra-v6-dist/$f" || true
          done
          python - <<'PY'
          import re, urllib.request
          from pathlib import Path
          origin="https://chatarra-preview.desorden-help-76b.workers.dev"
          root=Path("chatarra-v6-dist")
          html=(root/"index.html").read_text(encoding="utf-8")
          paths=sorted(set(re.findall(r'/(?:assets|images|fonts)/[A-Za-z0-9._/-]+', html)))
          for path in paths:
              dest=root/path.lstrip("/")
              dest.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(origin+path, dest)
          print("mirrored", len(paths), "assets")
          PY

      - name: Generate continuous 3D MP4
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy matplotlib
          ffmpeg -version >/dev/null
          python scripts/chatarra-preview-v6/render_3d.py
          test -s chatarra-v6-dist/media/scrap-3d-loop.mp4

      - name: Replace static sculpture with autoplay video
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("chatarra-v6-dist/index.html")
          t=p.read_text(encoding="utf-8")
          t=re.sub(
              r'<svg class="sculpture"[^>]*>.*?</svg>',
              '<video class="sculpture-video" autoplay loop muted playsinline preload="auto" disablepictureinpicture tabindex="-1"><source src="/media/scrap-3d-loop.mp4" type="video/mp4"></video>',
              t, count=1, flags=re.S
          )
          t=t.replace('class="sculpture-stage" aria-hidden="true"', 'class="sculpture-stage" aria-hidden="true" data-video-loop="scrap-3d-v6"')
          css='''<style id="scrap-3d-v6-style">
          .sculpture-video{width:112%;max-width:none;height:auto;aspect-ratio:1/1;object-fit:contain;position:absolute;left:-5%;top:-2%;pointer-events:none;user-select:none;filter:drop-shadow(0 24px 20px rgb(0 0 0/.32))}
          </style>'''
          t=t.replace('</head>', css+'</head>')
          p.write_text(t,encoding="utf-8")
          PY
          grep -q 'data-video-loop="scrap-3d-v6"' chatarra-v6-dist/index.html
          grep -q 'autoplay loop muted playsinline' chatarra-v6-dist/index.html

      - name: Verify Cloudflare auth
        run: npx --yes wrangler@4 whoami

      - name: Deploy V6
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config wrangler.chatarra-preview-v6.jsonc 2>&1 | tee wrangler-v6.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-v6.log | tail -1 || true)"
          test -n "$url"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "Preview URL: $url"

      - name: Smoke test HTML and video
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..8}; do
            body="$(mktemp)"
            status="$(curl -sS -L --max-time 20 -o "$body" -w '%{http_code}' "$PREVIEW_URL/" || true)"
            if [[ "$status" == "200" ]] && grep -q 'scrap-3d-v6' "$body"; then
              break
            fi
            sleep 5
          done
          test "$status" = "200"
          grep -q 'scrap-3d-v6' "$body"
          video="$(mktemp)"
          vstatus="$(curl -sS -L --max-time 30 -o "$video" -w '%{http_code}' "$PREVIEW_URL/media/scrap-3d-loop.mp4")"
          test "$vstatus" = "200"
          test "$(wc -c < "$video")" -gt 100000
          echo "V6 verified: $PREVIEW_URL"
