name: Diagnose deploy smoke 403

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public response headers
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://www.desorden.cat/' 'https://www.desorden.cat/automatizacion/' 'https://desorden.cat/'; do
            echo "URL: $url"
            for agent in 'curl' 'DESORDEN-Deploy-Smoke-Test/1.0'; do
              headers="$(mktemp)"
              if [[ "$agent" == curl ]]; then
                status="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "$url")"
              else
                status="$(curl -sS -A "$agent" -D "$headers" -o /dev/null -w '%{http_code}' --max-time 20 "$url")"
              fi
              echo "agent=$agent status=$status"
              grep -Ei '^(HTTP/|server:|cf-ray:|cf-mitigated:|content-type:|location:)' "$headers" || true
              rm "$headers"
            done
          done
          if command -v google-chrome >/dev/null; then
            for url in 'https://www.desorden.cat/' 'https://www.desorden.cat/automatizacion/'; do
              page="$(timeout 30s google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$url" 2>/dev/null || true)"
              echo "chrome_url=$url home_marker=$(grep -q 'SI NO ET VEUEN' <<< "$page" && echo yes || echo no) automation_marker=$(grep -q 'MENYS FEINA' <<< "$page" && echo yes || echo no) challenged=$(grep -qi 'Just a moment' <<< "$page" && echo yes || echo no)"
            done
          else
            echo 'google-chrome not installed on runner'
          fi
  probe_windows:
    runs-on: windows-latest
    steps:
      - name: Check public GET from Windows runner
        shell: pwsh
        run: |
          foreach ($url in @('https://www.desorden.cat/', 'https://www.desorden.cat/automatizacion/', 'https://desorden.cat/')) {
            try {
              $response = Invoke-WebRequest -Uri $url -MaximumRedirection 0 -SkipHttpErrorCheck -UseBasicParsing -ErrorAction Stop
              Write-Output "$url status=$([int]$response.StatusCode) challenge=$($response.Headers['cf-mitigated']) location=$($response.Headers.Location)"
            } catch {
              Write-Output "$url error=$($_.Exception.GetType().Name)"
            }
          }
