name: Inspect public Google Form once

on:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public form and extract question entry IDs
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 \
            'https://docs.google.com/forms/d/e/1FAIpQLScx9iV2di1SzOfF1R-NsLiI8MN5gF1fygM1-b3U1Y5uRbCLfw/viewform' \
            -o /tmp/form.html
          python - <<'PY'
          from pathlib import Path
          import re, html
          s = Path('/tmp/form.html').read_text(errors='replace')
          pattern = re.compile(r'data-params="%.@\.\[(\d+),&quot;([^&]+)&quot;.*?\[\[(\d+),')
          print('FORM_ENTRY_MAP')
          seen = set()
          for m in pattern.finditer(s):
              title = html.unescape(m.group(2))
              entry = m.group(3)
              key = (title, entry)
              if key not in seen:
                  seen.add(key)
                  print(f'{title}\tentry.{entry}')
          print('SERVICE_OPTIONS')
          marker='&quot;Servicio&quot;'
          idx=s.find(marker)
          if idx >= 0:
              snippet=html.unescape(s[idx:idx+2500])
              for option in ['Avería aire acondicionado','Aerotermia','Mantenimiento','VRF/VRV','Instalación','Consulta técnica']:
                  if option in snippet:
                      print(option)
          print('PRIORITY_OPTIONS')
          for option in ['ALTA','MEDIA','BAJA']:
              print(option)
          PY
