name: Validate Nutrikom PR media

on:
  push:
    branches:
      - "feat/nutrikom-real-video-20260923"
    paths:
      - ".github/workflows/nutrikom-pr-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Verify media
        shell: bash
        run: |
          set -euo pipefail
          HQ=public/media/portfolio/hq/nutrikom-ntk-runners.mp4
          PREVIEW=public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4
          POSTER=public/media/portfolio/previews-v2/nutrikom-ntk-runners.webp
          test -f "$HQ"
          test -f "$PREVIEW"
          test -f "$POSTER"
          test "$(stat -c%s "$HQ")" -lt 26214400
          test "$(stat -c%s "$PREVIEW")" -lt 26214400
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$HQ")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$HQ")" = "yuv420p"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$HQ")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$HQ")" = "1920"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$PREVIEW")" = "h264"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$PREVIEW")" = "yuv420p"
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$PREVIEW" | cut -d. -f1)" = "6"
          python - <<'PY'
          from pathlib import Path
          for path in [
              Path("public/media/portfolio/hq/nutrikom-ntk-runners.mp4"),
              Path("public/media/portfolio/previews-v2/nutrikom-ntk-runners.mp4"),
          ]:
              b=path.read_bytes()
              off=0
              atoms=[]
              while off+8<=len(b):
                  size=int.from_bytes(b[off:off+4],"big")
                  tag=b[off+4:off+8].decode("latin1")
                  if size==1:
                      size=int.from_bytes(b[off+8:off+16],"big")
                  atoms.append(tag)
                  if not size:
                      break
                  off += size
              assert atoms.index("moov") < atoms.index("mdat"), (path, atoms[:8])
          PY
      - name: Run tests
        run: npm test
